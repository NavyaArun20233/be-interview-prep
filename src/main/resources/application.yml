spring:
  application:
    name: be-interview-prep
  datasource:
    # Local defaults match the README's docker command; override via environment variables.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tdb}
    username: ${SPRING_DATASOURCE_USERNAME:tdb}
    password: ${SPRING_DATASOURCE_PASSWORD:tdb}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  links:
    # Public origin of short URLs (shortUrl = base-url + "/" + code).
    base-url: ${APP_LINKS_BASE_URL:http://localhost:8080}
  security:
    jwt:
      # secret: REQUIRED, no default. HMAC-SHA256 key of at least 32 bytes, supplied via the
      # APP_SECURITY_JWT_SECRET environment variable (generate with: openssl rand -base64 48).
      # Access-token lifetime.
      ttl: PT15M
    # admin: optional first ADMIN account, created at startup if absent. Supply both via
    # APP_SECURITY_ADMIN_EMAIL and APP_SECURITY_ADMIN_PASSWORD; never commit values.
